<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="590" viewBox="0 0 1440 590" role="img" aria-labelledby="title description">
  <title id="title">How test-container works</title>
  <desc id="description">A Playwright suite is selected by tags, executed natively or in Docker, failures are re-run, triaged deterministically, and summarized in compact local reports.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#62748a"/>
    </marker>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { fill: #102a43; font-size: 30px; font-weight: 700; }
      .subtitle { fill: #526579; font-size: 16px; }
      .card-title { fill: #102a43; font-size: 19px; font-weight: 700; }
      .body { fill: #334e68; font-size: 15px; }
      .small { fill: #526579; font-size: 13px; }
      .number { fill: #fff; font-size: 15px; font-weight: 700; text-anchor: middle; }
      .card { fill: #fff; stroke: #d7e1eb; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #62748a; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1440" height="590" rx="20" fill="#f3f7fb"/>
  <text x="64" y="58" class="title">From test suite to root causes</text>
  <text x="64" y="88" class="subtitle">Only failures move forward for analysis; evidence and reports stay on your machine.</text>

  <rect x="64" y="132" width="290" height="306" rx="16" class="card"/>
  <circle cx="96" cy="170" r="18" fill="#2364aa"/>
  <text x="96" y="175" class="number">1</text>
  <text x="126" y="177" class="card-title">Playwright suite</text>
  <text x="88" y="224" class="body">
    <tspan x="88" dy="0">Your existing project and tests</tspan>
    <tspan x="88" dy="30">Selected by tags and projects</tspan>
    <tspan x="88" dy="30">No test files are modified</tspan>
  </text>
  <rect x="88" y="346" width="242" height="58" rx="10" fill="#eaf2fb"/>
  <text x="106" y="370" class="small">Passing tests</text>
  <text x="106" y="390" class="body" font-weight="700">counted, then discarded</text>

  <path d="M366 285 H410" class="arrow"/>
  <rect x="426" y="132" width="290" height="306" rx="16" class="card"/>
  <circle cx="458" cy="170" r="18" fill="#2364aa"/>
  <text x="458" y="175" class="number">2</text>
  <text x="488" y="177" class="card-title">Local runner</text>
  <text x="450" y="224" class="body">
    <tspan x="450" dy="0">Runs the filtered selection</tspan>
    <tspan x="450" dy="30">Re-runs failures only</tspan>
    <tspan x="450" dy="30">Collects errors and attachments</tspan>
  </text>
  <rect x="450" y="346" width="242" height="58" rx="10" fill="#eaf2fb"/>
  <text x="468" y="370" class="small">Runtime</text>
  <text x="468" y="390" class="body" font-weight="700">native or Docker/Podman</text>

  <path d="M728 285 H772" class="arrow"/>
  <rect x="788" y="132" width="290" height="306" rx="16" class="card"/>
  <circle cx="820" cy="170" r="18" fill="#15806d"/>
  <text x="820" y="175" class="number">3</text>
  <text x="850" y="177" class="card-title">Deterministic core</text>
  <text x="812" y="224" class="body">
    <tspan x="812" dy="0">Normalizes errors and evidence</tspan>
    <tspan x="812" dy="30">Groups identical signatures</tspan>
    <tspan x="812" dy="30">Classifies with local rules</tspan>
  </text>
  <rect x="812" y="346" width="242" height="58" rx="10" fill="#e8f5f1"/>
  <text x="830" y="370" class="small">No AI, ML, or telemetry</text>
  <text x="830" y="390" class="body" font-weight="700">reproducible results</text>

  <path d="M1090 285 H1134" class="arrow"/>
  <rect x="1150" y="132" width="226" height="306" rx="16" class="card"/>
  <circle cx="1182" cy="170" r="18" fill="#845ec2"/>
  <text x="1182" y="175" class="number">4</text>
  <text x="1212" y="177" class="card-title">Reports</text>
  <text x="1174" y="224" class="body">
    <tspan x="1174" dy="0">summary.md</tspan>
    <tspan x="1174" dy="30">failures.json</tspan>
    <tspan x="1174" dy="30">Groups with evidence</tspan>
  </text>
  <rect x="1174" y="346" width="178" height="58" rx="10" fill="#f1ecf8"/>
  <text x="1192" y="370" class="small">Agents and QA get</text>
  <text x="1192" y="390" class="body" font-weight="700">only what matters</text>

  <rect x="64" y="472" width="1312" height="70" rx="14" fill="#102a43"/>
  <text x="92" y="501" fill="#fff" font-size="15" font-weight="700">Interfaces</text>
  <text x="92" y="524" fill="#d9e7f5" font-size="14">CLI for the terminal</text>
  <circle cx="262" cy="510" r="3" fill="#8fb9e8"/>
  <text x="284" y="524" fill="#d9e7f5" font-size="14">MCP server for coding agents</text>
  <circle cx="500" cy="510" r="3" fill="#8fb9e8"/>
  <text x="522" y="524" fill="#d9e7f5" font-size="14">Artifacts in .test-container/runs/</text>
</svg>
